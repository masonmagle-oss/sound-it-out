<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sound it out: icon options</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@700&display=swap">
<style>
  body{margin:0; padding:24px 14px 50px; background:#f3eee2; font:16px/1.5 system-ui,sans-serif; color:#1d2433}
  h1{font:700 22px system-ui; margin:0 0 4px; text-align:center}
  p.sub{max-width:40rem; margin:0 auto 20px; text-align:center; color:#4a5160}
  .row{display:flex; flex-wrap:wrap; gap:16px; justify-content:center}
  .c{width:180px; text-align:center; background:#fffdf7; border:3px solid #1d2433; border-radius:14px; box-shadow:0 5px 0 #1d2433; padding:12px 8px 10px}
  .c svg{width:130px; height:130px; display:block; margin:0 auto}
  .c b{display:block; font-size:16px; margin-top:4px}
  .c span{display:block; font-size:13px; color:#4a5160}
  .small{display:flex; gap:10px; justify-content:center; margin:6px 0 0}
  .small svg{width:44px; height:44px}
</style>
</head>
<body>
<h1>Sound it out: three icon ideas</h1>
<p class="sub">The game is: touch each sound, then hear the word come together. Each icon is shown big, and small (about the size it has on the phone's menu).</p>
<div class="row" id="row"></div>
<script>
const S = i => '<svg viewBox="0 0 100 100" stroke="#1d2433" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">' + i + '</svg>';
const t = (x, y, ch, fill = '#1d2433', size = 30) => `<text x="${x}" y="${y}" text-anchor="middle" font-family="Andika,Comic Sans MS,sans-serif" font-weight="700" font-size="${size}" fill="${fill}" stroke="none">${ch}</text>`;
const opts = [
  ['A. Three blocks, one lifted', 'The sounds, joined into a word, the middle one speaking.',
    S('<rect x="6" y="36" width="28" height="36" rx="4" fill="#d9b07a"/><rect x="36" y="22" width="28" height="36" rx="4" fill="#e8c796"/><rect x="66" y="36" width="28" height="36" rx="4" fill="#d9b07a"/><path d="M6 76h88" fill="none" stroke="#8a6a3c" stroke-width="5"/><path d="M44 12l-4-6M50 10V3M56 12l4-6" fill="none" stroke="#ffd23f" stroke-width="3.5"/>' + t(20, 64, 'c') + t(50, 50, 'a') + t(80, 64, 't'))],
  ['B. A mouth saying the sound', 'Matches the mouth pictures in Letters.',
    S('<path d="M10 52Q50 8 90 52Q50 92 10 52Z" fill="#e63b2e"/><path d="M24 52Q50 28 76 52Q50 72 24 52Z" fill="#1d2433"/><path d="M36 60Q50 52 64 60Q50 68 36 60Z" fill="#ff8fb8" stroke="none"/><path d="M4 22l10 8M2 50h10M4 78l10-8M96 22l-10 8M98 50H88M96 78l-10-8" fill="none" stroke="#ffd23f" stroke-width="3.5"/>')],
  ['C. A finger touching a block', 'Says "touch each sound" without any letters.',
    S('<rect x="14" y="48" width="56" height="40" rx="6" fill="#d9b07a"/><path d="M14 82h56" fill="none" stroke="#8a6a3c" stroke-width="5"/><path d="M62 10q-8 0-8 8v24l-7-5q-6-2-6 4l12 22q4 6 12 6h8q8 0 10-8l2-22q0-6-6-6q-2-6-8-4q-2-4-8-2V18q0-8-1-8Z" fill="#ffd9a8" transform="translate(-2 -2)"/><path d="M82 58q6-4 10 2M86 70q8-2 11 4" fill="none" stroke="#2457d6" stroke-width="3"/>' + t(40, 76, 's', '#1d2433', 26))]
];
document.getElementById('row').innerHTML = opts.map(([n, d, svg]) => `<div class="c">${svg}<b>${n}</b><span>${d}</span><div class="small">${svg}</div></div>`).join('');
</script>
</body>
</html>
