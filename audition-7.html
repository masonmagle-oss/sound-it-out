<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sound check 7</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#111;--card:#f1f3f7;--acc:#0b5fff}
@media (prefers-color-scheme:dark){:root{--bg:#111;--fg:#fff;--card:#222a38;--acc:#7aa7ff}}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font:18px/1.4 -apple-system,system-ui,sans-serif}
h1{font-size:24px}h2{font-size:20px;margin:24px 0 8px}
.row{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:14px;padding:8px 12px;margin:8px 0;flex-wrap:wrap}
button{min-height:56px;min-width:56px;font:inherit;border-radius:12px;border:2px solid var(--acc);background:transparent;color:var(--fg);padding:0 16px}
button[aria-pressed=true]{background:var(--acc);color:#fff}
.lbl{flex:1;min-width:6rem}
.w{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.w .row{margin:0;flex-wrap:nowrap}
#out{white-space:pre-wrap;background:var(--card);padding:12px;border-radius:12px}
</style></head><body>
<h1>Sound check</h1>
<p>Part 1: pick the best take. Part 2: play each new word and tap ✗ on any that sounds wrong or cut off. Part 3: play the stories. Then tap “Show my results” and send me the text.</p>
<h2>Part 1 · Sounds</h2><div id="groups"></div>
<h2>Part 2 · New spelling-pattern words</h2><div id="words" class="w"></div>
<h2>Part 3 · Stories</h2><div id="stories"></div>
<p><button id="show">Show my results</button></p>
<div id="out" role="status"></div>
<script>
const G={"short a (cat)": ["a", "t-a_ack_1", "t-a_ack_2", "t-a_ack_3", "t-a_ack_4", "t-a_add_1", "t-a_add_2", "t-a_add_3", "t-a_add_4", "c6-aah"], "short u (cup)": ["u", "t-u_uck_1", "t-u_uck_2", "t-u_uck_3", "t-u_uck_4"], "er (her, bird)": ["er"], "ar (car)": ["ar"], "long o (go)": ["o_long"], "y (yes)": ["y"], "d (dog)": ["d", "c-d"], "z (zip)": ["z"]}, WORDS=["catch", "patch", "witch", "stitch", "hatch", "pitch", "bridge", "badge", "fudge", "judge", "new", "flew", "drew", "screw", "stew", "chew", "news", "clue", "ear", "year", "dear", "fear", "hear", "air", "chair", "hair", "pair", "fair", "square", "scare", "share", "jumped", "kicked", "helped", "played", "rained", "painted", "planted", "cats", "hats", "pigs", "dogs", "bugs", "boxes", "foxes", "buses"], STORIES=[{"t": "The Red Hen", "e": "🐔", "l": ["A red hen sat on a nest.", "A fox came to the nest.", "The hen said no, no, no!", "The fox ran away."]}, {"t": "Pig in the Mud", "e": "🐷", "l": ["The pig can run in the mud.", "Pig got wet.", "Pig got in the tub.", "Now the pig is not wet."]}, {"t": "The Big Bus", "e": "🚌", "l": ["The bus is red.", "The bus can go up the hill.", "We see a dog on the bus.", "The dog can sit."]}, {"t": "Cat and Dog", "e": "🐱", "l": ["The cat sat on the mat.", "The dog came to the mat.", "The cat ran up the tree.", "The dog sat and sat."]}, {"t": "The Frog", "e": "🐸", "l": ["A frog sat on a log.", "The frog can hop and hop.", "Hop, hop, hop, in the pond.", "Splash! The frog can swim."]}, {"t": "A Day at the Park", "e": "🏞️", "l": ["We go to the park.", "I play on the slide.", "My mom sits on the bench.", "We like the park."]}, {"t": "The Sun and Rain", "e": "🌈", "l": ["The sun is up.", "Then the rain came.", "The rain is wet.", "Look at the rainbow."]}, {"t": "The Fish", "e": "🐟", "l": ["A fish can swim.", "The fish can not hop.", "The fish swims in the sea.", "Swim, fish, swim!"]}, {"t": "At the Farm", "e": "🚜", "l": ["We go to the farm.", "I see a cow and a horse.", "The sheep eat the grass.", "The farm is fun."]}, {"t": "Bedtime", "e": "🌙", "l": ["The sun is down.", "The moon is up.", "I get in my bed.", "Good night, moon."]}, {"t": "The Little Bug", "e": "🐞", "l": ["A little bug sat on a leaf.", "The wind blew.", "The bug flew away.", "Bye bye, bug."]}, {"t": "My Dog Max", "e": "🐕", "l": ["I have a dog.", "His name is Max.", "Max can run and jump.", "I like my dog Max."]}];
const au=new Audio(),picks={},bad={};
const play=(url)=>{au.src=url;au.play().catch(()=>{})};
const box=document.getElementById('groups');
for(const g in G){const h=document.createElement('h3');h.textContent=g;box.appendChild(h);
 G[g].forEach((n,i)=>{const d=document.createElement('div');d.className='row';d.dataset.g=g;
  const p=document.createElement('button');p.textContent='\u25B6';p.setAttribute('aria-label','play '+n);
  p.onclick=()=>play((i?(n.startsWith('t-')||n.startsWith('c')?'candidates/':'sounds/'):'sounds/')+n+'.mp3');
  const l=document.createElement('span');l.className='lbl';l.textContent=i?('Take '+i+' ('+n+')'):'Current';
  const b=document.createElement('button');b.textContent='Best';b.setAttribute('aria-pressed','false');
  b.onclick=()=>{picks[g]=n;document.querySelectorAll('[data-g="'+g+'"] button:last-child').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true')};
  d.append(p,l,b);box.appendChild(d)})}
const wb=document.getElementById('words');
WORDS.forEach(w=>{const d=document.createElement('div');d.className='row';
 const p=document.createElement('button');p.textContent=w;p.onclick=()=>play('sounds/word-'+w+'.mp3');
 const x=document.createElement('button');x.textContent='\u2717';x.setAttribute('aria-label','mark '+w+' as wrong');x.setAttribute('aria-pressed','false');
 x.onclick=()=>{bad[w]=!bad[w];x.setAttribute('aria-pressed',bad[w]?'true':'false')};
 d.append(p,x);wb.appendChild(d)});
const sb=document.getElementById('stories');
STORIES.forEach((s,si)=>{const h=document.createElement('h3');h.textContent=s.e+' '+s.t;sb.appendChild(h);
 s.l.forEach((t,li)=>{const k='sentence-'+t.toLowerCase().replace(/[^a-z ]/g,'').trim().replace(/ +/g,'-');
  const d=document.createElement('div');d.className='row';
  const p=document.createElement('button');p.textContent='\u25B6';p.onclick=()=>play('sounds/'+k+'.mp3');
  const l=document.createElement('span');l.className='lbl';l.textContent=t;
  const x=document.createElement('button');x.textContent='\u2717';x.setAttribute('aria-pressed','false');x.setAttribute('aria-label','mark line as wrong');
  x.onclick=()=>{bad[k]=!bad[k];x.setAttribute('aria-pressed',bad[k]?'true':'false')};
  d.append(p,l,x);sb.appendChild(d)})});
document.getElementById('show').onclick=()=>{
 const pk=Object.keys(G).map(g=>g+': '+(picks[g]||'(not picked)')).join('\n');
 const bd=Object.keys(bad).filter(k=>bad[k]);
 document.getElementById('out').textContent=pk+'\n\nWrong: '+(bd.length?bd.join(', '):'none')};
</script></body></html>
